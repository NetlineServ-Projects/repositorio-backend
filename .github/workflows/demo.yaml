name: CI/CD Pipeline - Demo

on:
  push:
    branches: [demo]

permissions:
  contents: read

concurrency:
  group: netline-repositorio-demo-deploy
  cancel-in-progress: false

env:
  DOCKER_IMAGE: netlineserv/repositorio-backend:demo
  DEPLOY_PATH: /root/projects/repositorio-backend
  BACKUP_DIR: /root/projects/backups/repositorio-backend
  BACKUP_KEEP: 10
  DB_SERVICE: db
  API_SERVICE: api

jobs:
  # CI - BUILD AND TEST
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run tests
        run: |
          if grep -q '"test"' package.json; then
            npm test
          fi

      - name: Build project
        run: |
          if grep -q '"build"' package.json; then
            npm run build
          fi


  # DOCKER - BUILD AND PUSH
  dockerize:
    name: Docker Build and Push
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # DEPLOY - DEMO SERVER
  deploy:
    name: Deploy to DEMO
    needs: dockerize
    runs-on: ubuntu-latest

    steps:
      # SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf "%s\n" "${{ secrets.DEMO_SERVER_SSH_KEY }}" \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H \
            ${{ secrets.DEMO_SERVER_IP }} \
            >> ~/.ssh/known_hosts

      # PULL IMAGE
      - name: Pull latest image
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'
            set -e
            cd ${{ env.DEPLOY_PATH }}
            sudo docker pull ${{ env.DOCKER_IMAGE }}
            echo "Image pulled successfully"
          EOF

      # VERIFY SERVICES
      - name: Verify Docker Compose service names
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << EOF
            set -e
            cd ${{ env.DEPLOY_PATH }}
            echo "Services defined in compose.yaml:"
            sudo docker compose config --services
            if ! sudo docker compose config --services | grep -qx "${{ env.DB_SERVICE }}"; then
              echo "ERROR: service '${{ env.DB_SERVICE }}' not found in compose.yaml."
              exit 1
            fi

            if ! sudo docker compose config --services | grep -qx "${{ env.API_SERVICE }}"; then
             echo "ERROR: service '${{ env.API_SERVICE }}' not found in compose.yaml."
             exit 1
            fi
          EOF

      # START DATABASE
      - name: Ensure database is up
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << EOF

            set -e

            cd ${{ env.DEPLOY_PATH }}

            sudo docker compose up -d ${{ env.DB_SERVICE }}

            echo "Waiting for database to be healthy..."

            # Espera até 60 segundos pelo healthcheck do docker compose
            for i in $(seq 1 12); do
              STATUS=$(sudo docker compose ps --format json ${{ env.DB_SERVICE }} 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo "")
              if [ "$STATUS" = "healthy" ]; then
                echo "Database is healthy."
                break
              fi
              echo "  Attempt $i/12 — waiting 5s..."
              sleep 5
              if [ "$i" = "12" ]; then
                echo "ERROR: Database did not become healthy in time."
                sudo docker compose ps
                exit 1
              fi
            done

          EOF

      # BACKUP MYSQL DATABASE
      - name: Backup database
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << EOF

            set -e

            cd ${{ env.DEPLOY_PATH }}

            sudo mkdir -p ${{ env.BACKUP_DIR }}

            TIMESTAMP=\$(date +%Y-%m-%d_%H-%M-%S)

            BACKUP_FILE="${{ env.BACKUP_DIR }}/backup_\${TIMESTAMP}.sql"

            echo "Creating MySQL backup..."

            sudo docker compose exec -T \
              ${{ env.DB_SERVICE }} \
              sh -c 'mysqldump \
                -u"\$MYSQL_USER" \
                -p"\$MYSQL_PASSWORD" \
                "\$MYSQL_DATABASE"' \
              | sudo tee "\$BACKUP_FILE" > /dev/null

            if [ ! -s "\$BACKUP_FILE" ]; then

              echo "ERROR: backup file is empty."

              sudo rm -f "\$BACKUP_FILE"

              exit 1

            fi

            echo "Backup created successfully:"
            echo "\$BACKUP_FILE"


            echo "Rotating backups..."

            cd ${{ env.BACKUP_DIR }}

            sudo ls -1t backup_*.sql 2>/dev/null \
              | tail -n +\$((${{ env.BACKUP_KEEP }} + 1)) \
              | xargs -r sudo rm --


            echo "Current backups:"

            sudo ls -1t backup_*.sql

          EOF



      # DATABASE MIGRATIONS
      - name: Run Prisma migrations
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'

            set -e

            cd ${{ env.DEPLOY_PATH }}

            sudo docker compose run --rm \
              --no-deps \
              -u node \
              api \
              npx prisma migrate deploy

            echo "Migrations completed successfully."

          EOF



      # DEPLOY API
      - name: Deploy API with new image
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'

            set -e

            cd ${{ env.DEPLOY_PATH }}

            echo "Stopping current API..."

            sudo docker compose stop api

            sudo docker compose rm -f api

            echo "Starting API with new image..."

            sudo docker compose up -d \
              --force-recreate \
              --pull always \
              api

            echo "API deployed successfully."

            sudo docker compose ps

          EOF

      # CLEANUP DOCKER
      - name: Cleanup Docker
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'

            set -e

            sudo docker image prune -f

            sudo docker system prune -f --volumes=false

          EOF

      # CLEANUP SSH
      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key