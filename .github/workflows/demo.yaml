name: CI/CD Pipeline - Demo

on:
  push:
    branches: [demo]

permissions:
  contents: read

concurrency:
  group: netline-repositorio-demo-deploy
  cancel-in-progress: false

env:
  DOCKER_REPO: netlineserv/repositorio-backend
  # Cada deploy fica com a sua própria versão (o commit), para se poder voltar atrás;
  # ":demo" aponta sempre para a última
  DOCKER_TAG_VERSAO: ${{ github.sha }}
  DOCKER_TAG_CANAL: demo
  DEPLOY_PATH: /root/projects/repositorio-backend
  BACKUP_DIR: /root/projects/backups/repositorio-backend
  BACKUP_KEEP: 10
  DB_SERVICE: db
  API_SERVICE: api

jobs:
  # CI - BUILD AND TEST
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # O generate não liga à base de dados: chega um endereço fictício
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci

      # Confirma que todos os ficheiros do servidor são JavaScript válido e carregam
      - name: Check syntax
        run: |
          find src prisma -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

  # DOCKER - BUILD AND PUSH
  dockerize:
    name: Docker Build and Push
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG_VERSAO }}
            ${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG_CANAL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # DEPLOY - DEMO SERVER
  deploy:
    name: Deploy to DEMO
    needs: dockerize
    runs-on: ubuntu-latest

    env:
      # Imagem exata deste deploy (usada pelo docker-compose do servidor através de API_IMAGE)
      API_IMAGE: netlineserv/repositorio-backend:${{ github.sha }}

    steps:
      # SSH
      # A chave do servidor vem do secret DEMO_SERVER_KNOWN_HOSTS (saída de
      # "ssh-keyscan -H <ip>" feita uma vez, de confiança). Sem ele, recorre ao keyscan,
      # que aceita a chave que o servidor apresentar nesse momento.
      - name: Setup SSH
        env:
          KNOWN_HOSTS: ${{ secrets.DEMO_SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh

          printf "%s\n" "${{ secrets.DEMO_SERVER_SSH_KEY }}" \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          if [ -n "$KNOWN_HOSTS" ]; then
            printf "%s\n" "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::DEMO_SERVER_KNOWN_HOSTS não definido; a usar ssh-keyscan."
            ssh-keyscan -H ${{ secrets.DEMO_SERVER_IP }} >> ~/.ssh/known_hosts
          fi

      # PULL IMAGE
      - name: Pull image
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'
            set -e
            cd ${{ env.DEPLOY_PATH }}
            sudo docker pull ${{ env.API_IMAGE }}
            echo "Image pulled successfully: ${{ env.API_IMAGE }}"
          EOF

      # VERIFY SERVICES
      - name: Verify Docker Compose service names
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'
            set -e
            cd ${{ env.DEPLOY_PATH }}
            echo "Services defined in compose.yaml:"
            sudo docker compose config --services
            if ! sudo docker compose config --services | grep -qx "${{ env.DB_SERVICE }}"; then
              echo "ERROR: service '${{ env.DB_SERVICE }}' not found in compose.yaml."
              exit 1
            fi

            if ! sudo docker compose config --services | grep -qx "${{ env.API_SERVICE }}"; then
             echo "ERROR: service '${{ env.API_SERVICE }}' not found in compose.yaml."
             exit 1
            fi
          EOF

      # START DATABASE
      # 'EOF' entre aspas: tudo o que está no bloco corre no servidor (antes, $(...) e $i
      # corriam na máquina do GitHub e a verificação nunca via o estado real)
      - name: Ensure database is up
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'

            set -e

            cd ${{ env.DEPLOY_PATH }}

            sudo docker compose up -d ${{ env.DB_SERVICE }}

            echo "Waiting for database to be healthy..."

            CONTENTOR=$(sudo docker compose ps -q ${{ env.DB_SERVICE }})

            for i in $(seq 1 12); do
              STATUS=$(sudo docker inspect --format '{{.State.Health.Status}}' "$CONTENTOR" 2>/dev/null || echo "")
              if [ "$STATUS" = "healthy" ]; then
                echo "Database is healthy."
                break
              fi
              if [ "$i" = "12" ]; then
                echo "ERROR: Database did not become healthy in time (status: $STATUS)."
                sudo docker compose ps
                exit 1
              fi
              echo "  Attempt $i/12 (status: $STATUS) - waiting 5s..."
              sleep 5
            done

          EOF

      # BACKUP MYSQL DATABASE AND UPLOADED FILES
      - name: Backup database and uploads
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'

            set -e

            cd ${{ env.DEPLOY_PATH }}

            sudo mkdir -p ${{ env.BACKUP_DIR }}

            TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)

            BACKUP_FILE="${{ env.BACKUP_DIR }}/backup_${TIMESTAMP}.sql"

            echo "Creating MySQL backup..."

            sudo docker compose exec -T \
              ${{ env.DB_SERVICE }} \
              sh -c 'mysqldump \
                -u"$MYSQL_USER" \
                -p"$MYSQL_PASSWORD" \
                "$MYSQL_DATABASE"' \
              | sudo tee "$BACKUP_FILE" > /dev/null

            if [ ! -s "$BACKUP_FILE" ]; then
              echo "ERROR: backup file is empty."
              sudo rm -f "$BACKUP_FILE"
              exit 1
            fi

            echo "Database backup created: $BACKUP_FILE"

            # Os documentos, fotografias e logótipos só existem nesta pasta
            if [ -d uploads ]; then
              UPLOADS_FILE="${{ env.BACKUP_DIR }}/uploads_${TIMESTAMP}.tar.gz"
              sudo tar -czf "$UPLOADS_FILE" uploads
              echo "Uploads backup created: $UPLOADS_FILE"
            fi

            echo "Rotating backups..."

            cd ${{ env.BACKUP_DIR }}

            for PADRAO in 'backup_*.sql' 'uploads_*.tar.gz'; do
              sudo ls -1t $PADRAO 2>/dev/null \
                | tail -n +$((${{ env.BACKUP_KEEP }} + 1)) \
                | xargs -r sudo rm --
            done

            echo "Current backups:"

            sudo ls -1t backup_*.sql uploads_*.tar.gz 2>/dev/null || true

          EOF

      # DATABASE MIGRATIONS AND SEED
      # Correm aqui, antes de trocar a API: se falharem, a versão anterior continua no ar
      - name: Run Prisma migrations
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'

            set -e

            cd ${{ env.DEPLOY_PATH }}

            sudo env API_IMAGE=${{ env.API_IMAGE }} docker compose run --rm \
              --no-deps \
              -u node \
              ${{ env.API_SERVICE }} \
              sh -c "npx prisma migrate deploy && node prisma/seed.js"

            echo "Migrations completed successfully."

          EOF

      # DEPLOY API
      - name: Deploy API with new image
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'

            set -e

            cd ${{ env.DEPLOY_PATH }}

            echo "Starting API with ${{ env.API_IMAGE }}..."

            # As migrações já correram no passo anterior
            sudo env API_IMAGE=${{ env.API_IMAGE }} MIGRAR_NO_ARRANQUE=false \
              docker compose up -d --no-deps --force-recreate ${{ env.API_SERVICE }}

            echo "Waiting for API to be healthy..."

            CONTENTOR=$(sudo docker compose ps -q ${{ env.API_SERVICE }})

            for i in $(seq 1 18); do
              STATUS=$(sudo docker inspect --format '{{.State.Health.Status}}' "$CONTENTOR" 2>/dev/null || echo "")
              if [ "$STATUS" = "healthy" ]; then
                echo "API deployed successfully."
                sudo docker compose ps
                exit 0
              fi
              echo "  Attempt $i/18 (status: $STATUS) - waiting 5s..."
              sleep 5
            done

            echo "ERROR: API did not become healthy. Last logs:"
            sudo docker compose logs --tail 50 ${{ env.API_SERVICE }}
            echo "To roll back: sudo API_IMAGE=netlineserv/repositorio-backend:<previous-commit> docker compose up -d ${{ env.API_SERVICE }}"
            exit 1

          EOF

      # CLEANUP DOCKER
      # Só imagens sem uso há mais de 7 dias: as versões recentes ficam para voltar atrás
      - name: Cleanup Docker
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEMO_SERVER_USERNAME }}@${{ secrets.DEMO_SERVER_IP }} << 'EOF'

            set -e

            sudo docker image prune -af --filter "until=168h"

          EOF

      # CLEANUP SSH
      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
