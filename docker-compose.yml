services:
  db:
    image: mysql:8
    restart: unless-stopped
    command: --mysql-native-password=ON   # NOVO — ativa o plugin de autenticação compatível com o Prisma
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"   # NOVO — 3307 no Windows aponta para o 3306 do contentor; 3306 do Windows continua livre para o MySQL local
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_NOME: ${ADMIN_NOME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
      ADMIN_NUMERO: ${ADMIN_NUMERO}
      ADMIN_CARGO: ${ADMIN_CARGO}
      ADMIN_DEPARTAMENTO: ${ADMIN_DEPARTAMENTO}

volumes:
  db_data: